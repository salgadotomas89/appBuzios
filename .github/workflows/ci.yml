name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Jest, TypeScript y ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Valores de ejemplo: las pruebas no contactan InsForge y no usan claves reales.
      - run: cp .env.example .env
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci
      # Otra zona horaria: detecta pruebas que confunden el día local con el día de Búzios.
      - run: npm test -- --ci
        env:
          TZ: Asia/Tokyo
      # Bundle de producción con Metro: detecta dependencias que Jest resuelve distinto (shared-schemas es ESM).
      # react-native-dotenv (allowUndefined: false) rechaza la clave vacía de .env.example: valores de relleno,
      # que no son ninguna clave ni apuntan a ningún tenant.
      - run: printf 'INSFORGE_URL=https://ci.invalid\nINSFORGE_ANON_KEY=ci-placeholder-not-a-key\n' > .env
      - run: npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output "$RUNNER_TEMP/ios.jsbundle" --assets-dest "$RUNNER_TEMP/ios-assets"
      - run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output "$RUNNER_TEMP/android.jsbundle" --assets-dest "$RUNNER_TEMP/android-assets"

  shared-reservations:
    name: Integración PostgreSQL local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Contenedor postgres:17 desechable; no se conecta a ningún tenant remoto.
      - run: npm run test:shared-reservations
      # Actualización desde etapas intermedias con datos creados por los RPC de cada etapa.
      - run: npm run test:migration-upgrade
      # El inventario que el operador compara con el tenant debe seguir a las migraciones.
      - run: npm run test:schema-inventory
      # Recorrido completo del piloto con datos sintéticos y la moderación previa activada.
      - run: npm run test:pilot-e2e
      # Como buziosflow: PostgreSQL 15, auth.users de InsForge y migraciones como project_admin sin superusuario.
      - run: npm run test:insforge-compat
