name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Jest, TypeScript y ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Valores de ejemplo: las pruebas no contactan InsForge y no usan claves reales.
      - run: cp .env.example .env
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci

  shared-reservations:
    name: Integración PostgreSQL local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Contenedor postgres:17 desechable; no se conecta a ningún tenant remoto.
      - run: npm run test:shared-reservations
